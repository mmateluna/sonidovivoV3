spring.application.name=sonido-vivo-usuarios
server.port=8084

# H2 para arrancar sin Laragon. Flyway crea las tablas; Hibernate solo las revisa.
spring.datasource.url=jdbc:h2:file:./data/usuarios;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

sonidovivo.jwt.secreto=sonidovivo-desarrollo-cambiar-esta-clave-por-una-larga
sonidovivo.jwt.minutos-acceso=60
sonidovivo.jwt.dias-refresh=7
sonidovivo.auth.url=http://localhost:8082
sonidovivo.interno.secreto=sonidovivo-interno
